name: Sync Fork Daily

on:
  schedule:
    # 每天 UTC 时间 20:00 (北京时间凌晨 04:00) 自动执行同步
    - cron: '0 20 * * *'
  # 允许手动在 GitHub 页面上触发同步
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写入权限，允许更新代码

    steps:
      - name: Sync upstream changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync ${{ github.repository }} -b main
